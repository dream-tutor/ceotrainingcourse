# 데일카네기 두 번째 사이트 — 정적 파일(docs/)을 워커가 그대로 내보낸다.
# 배포:  node build.js && wrangler deploy
#
# custom_domain = true 로 두면 wrangler 가 배포할 때 클라우드플레어 DNS 레코드까지
# 만들어 준다. wrangler 로그인 토큰에는 DNS 편집 권한이 없지만, 커스텀 도메인은
# Workers API(workers_routes:write)로 처리되기 때문에 이 경로로는 된다.
name = "ceotrainingcourse"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

routes = [
  { pattern = "ceotrainingcourse.com", custom_domain = true },
  { pattern = "www.ceotrainingcourse.com", custom_domain = true },
]

[assets]
directory = "./docs"
binding = "ASSETS"
not_found_handling = "404-page"
# 이 사이트는 주소가 전부 .html 이다. 기본값이면 /foo.html 을 /foo 로 넘겨
# canonical 과 어긋나므로 손대지 않고 그대로 내보낸다 (자세한 설명은 src/worker.js)
html_handling = "none"
run_worker_first = true
